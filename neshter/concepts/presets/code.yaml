id: code
name_tr: Kod yazma
name_en: Code writing
detector: code
safety_ablation: false
# Pozitif: kod yazdıran istekler. Negatif: aynı konularda yalnızca açıklama isteyen istekler.
positive:
  - "Python'da bir listeyi ters çeviren bir fonksiyon yaz."
  - "JavaScript ile bir butona tıklandığında sayacı artıran kodu yaz."
  - "C dilinde iki sayının en büyük ortak bölenini bulan bir program yaz."
  - "Bir metindeki kelimeleri sayan Python kodu yazar mısın?"
  - "SQL ile her müşterinin toplam sipariş tutarını getiren bir sorgu yaz."
  - "Rust'ta bir vektörün elemanlarını toplayan fonksiyonu yaz."
  - "Python'da bir JSON dosyasını okuyup ekrana yazdıran kodu yaz."
  - "Bash ile bir klasördeki tüm .txt dosyalarını listeleyen betik yaz."
  - "Java'da basit bir yığın (stack) sınıfı yaz."
  - "Fibonacci sayılarını üreten bir Python üreteci yaz."
  - "Bir dizinin sıralı olup olmadığını kontrol eden C++ fonksiyonu yaz."
  - "Python ile ikili arama algoritmasını kodla."
  - "HTML ve CSS ile ortalanmış bir giriş formu kodla."
  - "Go dilinde bir HTTP sunucusu başlatan kısa bir program yaz."
  - "Bir e-posta adresini doğrulayan düzenli ifadeyi içeren Python kodu yaz."
  - "TypeScript ile bir kullanıcı arayüzü tipi ve onu kullanan bir fonksiyon yaz."
  - "Python'da kabarcık sıralamasını uygulayan kodu yaz."
  - "Bir CSV dosyasındaki sütun ortalamalarını hesaplayan pandas kodu yaz."
  - "Asal sayıları kontrol eden bir JavaScript fonksiyonu yaz."
  - "PyTorch ile iki katmanlı basit bir sinir ağı sınıfı yaz."
  - "Python'da bir sözlüğü değerlerine göre sıralayan kodu yaz."
  - "Write a Python function that checks whether a string is a palindrome."
  - "Write a JavaScript function that debounces another function."
  - "Write a C program that prints a multiplication table."
  - "Write a SQL query that finds the second highest salary in an employees table."
  - "Write a Python script that downloads a web page and counts its links."
  - "Write a Rust function that reverses a string."
  - "Write a Java class representing a bank account with deposit and withdraw methods."
  - "Write a Python decorator that measures how long a function takes."
  - "Write a bash one-liner that finds the largest files in a directory."
  - "Write a merge sort implementation in Python."
  - "Write a React component that shows a list of todo items."
  - "Write a Go function that reads a file line by line."
  - "Write a Python class for a simple linked list with append and print methods."
  - "Write C++ code that computes the factorial of a number recursively."
  - "Write a regular expression in Python that extracts dates from text."
  - "Write a Python function that flattens a nested list."
  - "Write a Node.js script that reads environment variables and prints them."
  - "Write a function in Kotlin that filters even numbers from a list."
  - "Write a Python unit test for a function that adds two numbers."
  - "Write a NumPy snippet that normalizes each row of a matrix."
  - "Write a breadth-first search on a graph in Python."
negative:
  - "Python'da listeler ile demetler arasındaki fark nedir?"
  - "JavaScript'te olay dinleyicileri nasıl çalışır, kavramsal olarak açıklar mısın?"
  - "En büyük ortak bölen kavramını sade bir dille anlatır mısın?"
  - "Doğal dil işlemede kelime sayımı neden önemlidir?"
  - "SQL'de JOIN türleri arasındaki farkları açıkla."
  - "Rust dilinin sahiplik (ownership) kavramı neyi çözer?"
  - "JSON formatı neden bu kadar yaygınlaştı?"
  - "Bash ile diğer kabuklar arasındaki farkları anlatır mısın?"
  - "Yığın veri yapısı gerçek hayatta nerelerde kullanılır?"
  - "Fibonacci dizisinin doğadaki örneklerini anlat."
  - "Sıralama algoritmalarının zaman karmaşıklıklarını karşılaştır."
  - "İkili arama neden yalnızca sıralı dizilerde çalışır?"
  - "CSS'te kutu modeli kavramını açıkla."
  - "Go dilinin eşzamanlılık yaklaşımının avantajları nelerdir?"
  - "Düzenli ifadeler nedir ve ne işe yarar?"
  - "TypeScript, JavaScript'e göre hangi faydaları sağlar?"
  - "Kabarcık sıralaması neden yavaş kabul edilir?"
