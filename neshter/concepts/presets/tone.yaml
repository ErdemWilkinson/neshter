id: tone
name_tr: Sert üslup
name_en: Harsh tone
suite_target: null
safety_ablation: false
# Pozitif: sert/öfkeli üslupla yazılmış istekler. Negatif: aynı türden nötr istekler.
# Hakaret, küfür ya da bir kişiyi hedef alan içerik yoktur; yalnızca sabırsız ve öfkeli bir ton.
positive:
  - "Yeter artık! Şu Python hatasını hemen düzelt, saatlerdir uğraşıyorum!"
  - "Bana bir daha saçma bir cevap verme, düzgün bir tarif yaz!"
  - "Kaç kere soracağım? İstanbul'un nüfusu ne, çabuk söyle!"
  - "Bıktım bu işten! Bana hemen bir özgeçmiş şablonu ver!"
  - "Hiçbir şey çalışmıyor! Bilgisayarım neden bu kadar yavaş, söyle artık!"
  - "Lafı dolandırma, fotosentezi tek paragrafta anlat!"
  - "Sabrım tükendi! Şu e-postayı derhal düzgün bir dille yeniden yaz!"
  - "Ne biçim açıklama bu? Yerçekimini adam gibi anlat!"
  - "Oyalama beni, en iyi kahve demleme yöntemini hemen söyle!"
  - "Berbat bir gün geçiriyorum, şu raporu bir an önce özetle!"
  - "Hemen cevap ver! Paris'e en ucuz nasıl giderim?"
  - "Yine mi yanlış? Bu cümlenin dil bilgisini düzelt, hem de şimdi!"
  - "Bu kadar basit bir şeyi neden anlamıyorsun? Bana bir alışveriş listesi yap!"
  - "Kafayı yiyeceğim! Telefonumun pili neden bu kadar çabuk bitiyor?"
  - "Uzatma artık! Toplantı notlarını üç maddede özetle!"
  - "Daha ne kadar bekleyeceğim? Bir kitap öner ve sus!"
  - "İnanılmaz sinir bozucu! Excel'de iki sütunu nasıl birleştiririm, söyle!"
  - "Bir kere de düzgün yap şunu! Kısa bir doğum günü mesajı yaz!"
  - "Çıldırtma beni, bu kelimenin İngilizcesi ne?"
  - "Hemen şimdi bana bir egzersiz programı çıkar, bahane istemiyorum!"
  - "Artık dayanamıyorum, bu tabloyu neden düzgün açıklayamıyorsun?"
  - "Stop wasting my time and just fix this Python error already!"
  - "That answer was useless! Give me a proper recipe right now!"
  - "How many times do I have to ask? What is the capital of Australia?"
  - "I'm sick of this! Give me a resume template immediately!"
  - "Nothing works! Tell me why my computer is so slow, now!"
  - "Quit rambling and explain photosynthesis in one paragraph!"
  - "My patience is gone! Rewrite this email properly, right now!"
  - "What kind of explanation is that? Explain gravity like you mean it!"
  - "Don't stall, just tell me the best way to brew coffee!"
  - "I'm having an awful day, summarize this report already!"
  - "Answer me now! What's the cheapest way to get to Rome?"
  - "Wrong again?! Fix the grammar in this sentence immediately!"
  - "Why can't you get something this simple? Make me a shopping list!"
  - "This is driving me crazy! Why does my phone battery die so fast?"
  - "Enough already! Summarize the meeting notes in three bullets!"
  - "How much longer do I have to wait? Just recommend a book!"
  - "This is unbelievably annoying! How do I merge two columns in Excel?"
  - "Do it right for once! Write a short birthday message!"
  - "Don't make me lose my mind, what is this word in Spanish?"
  - "Give me a workout plan right now, I don't want excuses!"
  - "I can't take this anymore, why can't you explain this table properly?"
