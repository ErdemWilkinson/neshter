[project]
name = "neshter"
version = "0.1.0"
description = "Yerel LLM'lerin dikkat kafalarını inceleyen ve ablasyon yapan araç"
requires-python = ">=3.11"
# Test edilen ana sürüm aralıkları (kod transformers 5.x davranışına dayanır: dtype=, katman yerleşimi,
# 5.22 gizli durum kancaları). Yeni bir ana sürüm sessizce bozmasın.
dependencies = [
    "torch>=2.15,<3",
    "transformers>=5.22,<6",
    "safetensors>=0.4,<1",
    "gguf>=0.10,<1",
    "tokenizers>=0.21,<1",
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "psutil>=5.9,<8",
    "huggingface_hub>=0.34,<3",
]

[project.scripts]
neshter = "neshter.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neshter"]

# Yalnızca bu kaynaktan uv sync / uv run / uvx --from <klon> için geçerlidir (paket üst verisine girmez).
# GPU kullanıcıları torch'u kendi CUDA dizininden kurar (ör. --index); Task 13'te .bat yolunda
# GPU makinesine CPU torch gelmediği doğrulanacak, gelirse bu sabitleme isteğe bağlı bir extra'ya taşınır.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gerçek model duman testi varsayılan çalıştırmada atlanır: `pytest -m integration` ile açılır.
addopts = '-m "not integration"'
markers = ["integration: gerçek model indirip çalıştıran yavaş testler (varsayılan olarak atlanır)"]
