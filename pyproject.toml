[project]
name = "neshter"
version = "0.1.0"
description = "Yerel LLM'lerin dikkat kafalarını inceleyen ve ablasyon yapan araç"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "gguf",
    "tokenizers",
    "numpy",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pyyaml",
    "psutil",
    "huggingface_hub",
]

[project.scripts]
neshter = "neshter.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neshter"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
