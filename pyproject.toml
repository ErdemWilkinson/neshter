[project]
name = "neshter"
version = "0.1.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Yerel LLM'lerin dikkat kafalarını inceleyen ve ablasyon yapan araç"
requires-python = ">=3.11"
# Test edilen ana sürüm aralıkları (kod transformers 5.x davranışına dayanır: dtype=, katman yerleşimi,
# 5.22 gizli durum kancaları). Yeni bir ana sürüm sessizce bozmasın.
dependencies = [
    # torch: asla 2.6'nın altına inmez (CVE-2025-32434, torch.load açığı).
    "torch>=2.15,<3",
    "transformers>=5.22,<6",
    "safetensors>=0.4,<1",
    "gguf>=0.10,<1",
    # accelerate: transformers 5.x, gguf_file= ile yüklemede zorunlu kılar (yoksa GGUF yüklenemez).
    "accelerate>=1.0,<2",
    "tokenizers>=0.21,<1",
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "psutil>=5.9,<8",
    "huggingface_hub>=0.34,<3",
    # jinja2: geçişli bağımlılık (transformers sohbet şablonları); alt sınır = sandbox CVE düzeltmeleri.
    "jinja2>=3.1.6,<4",
]

[project.scripts]
neshter = "neshter.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]
# torch derlemesi (yalnızca bu kaynaktan uv ile çalıştırırken): varsayılan CPU. neshter.bat bir NVIDIA kartı
# görürse `--no-group cpu --group gpu` ile CUDA derlemesini seçer. İkisi aynı ortamda olamaz.
cpu = ["torch>=2.15,<3"]
gpu = ["torch>=2.15,<3"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neshter"]
# Derlenmiş arayüz (neshter/web/dist) wheel'e girsin: VCS/gitignore süzgeci onu atlamasın.
artifacts = ["neshter/web/dist/**"]

# Yalnızca bu kaynaktan uv sync / uv run / uvx --from <klon> için geçerlidir (paket üst verisine girmez).
# torch 2.15'in Windows CUDA derlemesi yalnızca cu132 dizininde (NVIDIA sürücüsü 580+ ister).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu132", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gerçek model duman testi varsayılan çalıştırmada atlanır: `pytest -m integration` ile açılır.
addopts = '-m "not integration"'
markers = ["integration: gerçek model indirip çalıştıran yavaş testler (varsayılan olarak atlanır)"]
