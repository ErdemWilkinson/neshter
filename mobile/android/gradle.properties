org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Where the exporter put the engine (mobile/export/export_qwen2.py) and where the phone build of the web UI is
# (npm run build:mobile in web/). Override with -Pneshter.modelDir=... / -Pneshter.webDir=...
neshter.modelDir=D:/neshter/mobile-build/qwen2.5-0.5b
neshter.webDir=../web-dist
# The repo lives under a non-ASCII folder (Masaüstü); nothing native is compiled here, so the check is off.
android.overridePathCheck=true
# Build outputs (the APK carries a 700 MB engine) stay out of the synced repo folder.
neshter.buildRoot=D:/neshter/android-build
# GGUF engine: llama.cpp source (pinned release v1.0.0) and the NDK that builds it.
neshter.llamaSrc=D:/neshter/llama.cpp-src
neshter.ndkVersion=29.0.14206865
neshter.ndkPath=D:/neshter/android-sdk-extra/ndk/29.0.14206865
