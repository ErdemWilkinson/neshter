<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neşter · Takımyıldız</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Düzen: tam ekran gökyüzü. Bağ grafiği üç boyutlu bir takımyıldız; sürükleyince döner. Köşelerde sessiz yazılar, ortada hiçbir düğme yok. Koyu öncelikli. */
  :root {
    --gece: #0b0d17; --murekkep: #e8e9f3; --soluk: #8b8fae; --cizgi: #252a44;
    --yildiz: #ffd58a; --bag: #7c8ae6; --sonuk: #ff6b6b;
    --f: "Jost", "Segoe UI", system-ui, sans-serif; --m: "DM Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --gece: #eef0f6; --murekkep: #151831; --soluk: #5b6084; --cizgi: #d4d8e8;
    --yildiz: #b86b00; --bag: #3a4bc4; --sonuk: #c62828; color-scheme: light; } }
  :root[data-theme="light"] {
    --gece: #eef0f6; --murekkep: #151831; --soluk: #5b6084; --cizgi: #d4d8e8;
    --yildiz: #b86b00; --bag: #3a4bc4; --sonuk: #c62828; color-scheme: light; }
  :root { --n-zemin: var(--gece); --n-yuzey: var(--gece); --n-murekkep: var(--murekkep); --n-soluk: var(--soluk); --n-cizgi: var(--cizgi); --n-vurgu: var(--sonuk); --n-ikinci: var(--bag); --n-f: var(--f); --n-m: var(--m); }
  * { box-sizing: border-box; }
  .cekmece { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 56vh; overflow: auto; background: color-mix(in srgb, var(--gece) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--cizgi); padding-block: 8px max(14px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cekmece-bas { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; cursor: pointer; font: 400 12px var(--m); color: var(--soluk); padding: 4px 0 8px; }
  .cekmece-bas:focus-visible { outline: 1px solid var(--yildiz); outline-offset: 2px; }
  .cekmece-bas b { font: 500 14px var(--f); color: var(--murekkep); }
  .cekmece.kapali #sistem { display: none; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--gece); color: var(--murekkep); font: 300 15px/1.5 var(--f); overflow: hidden; }
  #gok { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #gok.surukle { cursor: grabbing; }
  .kose { position: fixed; display: grid; gap: 4px; pointer-events: none; max-width: min(24rem, calc(100vw - 32px)); }
  .kose * { pointer-events: auto; }
  .sol-ust { top: max(18px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
  .sag-ust { top: max(18px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); text-align: right; justify-items: end; }
  .sol-alt { bottom: calc(var(--cek-h, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px)); }
  .sag-alt { bottom: calc(var(--cek-h, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px)); text-align: right; justify-items: end; }
  a { color: var(--soluk); text-decoration: none; font-size: 13px; }
  a:hover, a:focus-visible { color: var(--yildiz); }
  h1 { margin: 0; font: 300 clamp(28px, 4.5vw, 46px)/1 var(--f); letter-spacing: 0.02em; }
  h1 b { font-weight: 700; }
  p { margin: 0; color: var(--soluk); font-size: 14px; }
  .buyuk { font: 500 clamp(40px, 7vw, 72px)/0.9 var(--f); font-variant-numeric: tabular-nums; color: var(--yildiz); }
  .m { font: 400 12px var(--m); color: var(--soluk); }
  .istem span { cursor: pointer; font: 400 12px var(--m); color: var(--soluk); margin-left: 12px; }
  .istem span.on { color: var(--murekkep); }
  .istem span:focus-visible { outline: 1px solid var(--yildiz); outline-offset: 2px; }
  .sonuk { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font: 400 12px var(--m); }
  .sonuk li { cursor: pointer; color: var(--sonuk); }
  .sonuk li::after { content: "  yak"; color: var(--soluk); }
  .degisti { color: var(--sonuk); }
  @media (max-width: 640px) { .sag-ust { display: none; } .sol-ust p { display: none; } }
</style>
</head>
<body>
<canvas id="gok" tabindex="0" aria-label="Üç boyutlu bağ grafiği; sürükle döndür, yıldıza tıkla söndür"></canvas>
<div class="kose sol-ust">
  <a href="index.html">← Setler</a>
  <h1>Takım<b>yıldız</b></h1>
  <p>Her yıldız bir özellik, aralarındaki çizgiler bağ. Sürükle, gökyüzü döner. Bir yıldıza tıkla, söndür; ona gelen bütün ışık kesilir.</p>
</div>
<div class="kose sag-ust istem" id="istemler"></div>
<div class="kose sol-alt">
  <span class="m">söndürülen</span>
  <ul class="sonuk" id="sonuk"></ul>
</div>
<div class="kose sag-alt" aria-live="polite">
  <span class="m" id="hedef-ad"></span>
  <span class="buyuk" id="cikti"></span>
  <span class="m" id="cikti-alt"></span>
</div>
<section class="cekmece" id="cekmece" aria-label="Neşter sistemleri">
  <div class="cekmece-bas" id="cekmece-bas" tabindex="0" role="button" aria-expanded="true"><b>Neşter sistemleri</b><span id="cekmece-ipucu">kapatmak için tıkla</span></div>
  <div id="sistem"></div>
</section>
<script src="neshter.js"></script>
<script src="sistem.js"></script>
<script>
(function () {
  const N = window.Nester, $ = (id) => document.getElementById(id), el = N.el;
  const d = { metin: "Türkiye'nin başkenti", sonuk: new Set(), secili: new Set(), yaw: -0.5, pitch: 0.25, zoom: 1, uzerinde: null };
  let S, yer = new Map(), cizimler = [], uyanik = 0;
  const cv = $('gok'), cek = $('cekmece');
  let dock = null;

  function yukle() {
    S = N.oturum('qwen05', d.metin); d.sonuk.clear(); d.secili.clear(); dock && dock.yenile();
    const r = N.rng(N.hash('yildiz' + d.metin)), G = S.graf, L = S.L;
    yer = new Map(G.dugumler.map((n) => {
      const y = n.tur === 'girdi' ? -1 : n.tur === 'cikti' ? 1.15 : -1 + 2 * (n.katman / L);
      const x = n.tur === 'cikti' ? 0 : (S.T > 1 ? n.konum / (S.T - 1) : 0.5) * 2 - 1;
      const z = n.tur === 'cikti' ? 0 : (r() - 0.5) * 1.3;
      return [n.id, { x: x * 1.1, y, z }];
    }));
    $('istemler').replaceChildren(...N.HAZIR.map((h) => el('span', { tabindex: '0', class: h.metin === d.metin ? 'on' : '', text: h.metin,
      onclick: () => { d.metin = h.metin; yukle(); }, onkeydown: (e) => { if (e.key === 'Enter') { d.metin = h.metin; yukle(); } } })));
    uyandir();
  }
  const kesikler = () => {
    const k = new Set();
    for (const b of S.graf.baglar) if (d.sonuk.has(b.h) || (d.sonuk.has(b.k) && S.graf.dugumler.find((n) => n.id === b.k).tur === 'girdi')) k.add(b.id);
    return k;
  };
  function yaz(a) {
    $('hedef-ad').textContent = '“' + S.istem.hedef.trim() + '” yıldızının parlaklığı';
    $('cikti').textContent = N.yuzde(a.cikti);
    const r = S.olc([]), p = a.tahminP, kaydi = p < r.rakipOnce + (r.once - p) * 0.55;
    $('cikti-alt').replaceChildren('olasılık ≈ ' + N.yuzde(p) + ' · kesimsiz ' + N.yuzde(r.once), kaydi ? el('span', { class: 'degisti', text: ' · tahmin ' + N.tok(S.istem.rakip) }) : '');
    const ad = (id) => S.graf.dugumler.find((n) => n.id === id).etiket;
    $('sonuk').replaceChildren(...(d.sonuk.size ? [...d.sonuk].map((id) => el('li', { tabindex: '0', text: ad(id), onclick: () => { d.sonuk.delete(id); uyandir(); }, onkeydown: (e) => { if (e.key === 'Enter') { d.sonuk.delete(id); uyandir(); } } }))
      : [el('li', { class: 'm', style: 'color:var(--soluk);cursor:default', text: 'henüz yok' })]));
  }

  function kare(t) {
    const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight, ch = cek.offsetHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    if (!N.azalt() && !surukle && t > uyanik) d.yaw += 0.0016;
    const cy = Math.cos(d.yaw), sy = Math.sin(d.yaw), cp = Math.cos(d.pitch), sp = Math.sin(d.pitch);
    const olcek = Math.min(w, h - ch) * 0.32 * d.zoom, ox = w / 2, oy = (h - ch) / 2 + 10;
    const proj = (p) => {
      const x1 = p.x * cy + p.z * sy, z1 = -p.x * sy + p.z * cy;
      const y2 = p.y * cp - z1 * sp, z2 = p.y * sp + z1 * cp;
      const f = 3.2 / (3.2 + z2);
      return { sx: ox + x1 * olcek * f, sy: oy - y2 * olcek * f, f, z: z2 };
    };
    const a = S.akis(kesikler()), P = new Map([...yer].map(([id, p]) => [id, proj(p)]));
    const renkY = N.css('--yildiz'), renkB = N.css('--bag'), renkS = N.css('--sonuk'), renkM = N.css('--murekkep'), renkSol = N.css('--soluk');
    const ks = kesikler();
    for (const b of S.graf.baglar) {
      const A = P.get(b.k), B = P.get(b.h), kes = ks.has(b.id);
      x.globalAlpha = kes ? 0.25 : Math.min(0.9, 0.15 + 0.75 * b.w * (a.oran.get(b.k) || 0));
      x.strokeStyle = kes ? renkS : renkB; x.lineWidth = kes ? 1 : 0.8 + 2.4 * b.w * (a.oran.get(b.k) || 0) * ((A.f + B.f) / 2);
      x.setLineDash(kes ? [3, 5] : []);
      x.beginPath(); x.moveTo(A.sx, A.sy); x.lineTo(B.sx, B.sy); x.stroke();
    }
    x.setLineDash([]); x.globalAlpha = 1;
    cizimler = S.graf.dugumler.map((n) => ({ n, p: P.get(n.id), o: a.oran.get(n.id) || 0 })).sort((u, v) => v.p.z - u.p.z);
    x.font = '12px ' + N.css('--m'); x.textAlign = 'center';
    for (const { n, p, o } of cizimler) {
      const son = d.sonuk.has(n.id), parlak = n.tur === 'girdi' ? 1 : o;
      const r = (n.tur === 'cikti' ? 9 : n.tur === 'girdi' ? 4 : 5) * p.f * (0.6 + 0.6 * parlak);
      if (!son && parlak > 0.05) {
        const g = x.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 4);
        g.addColorStop(0, renkY); g.addColorStop(1, 'transparent');
        x.globalAlpha = 0.35 * parlak; x.fillStyle = g; x.beginPath(); x.arc(p.sx, p.sy, r * 4, 0, Math.PI * 2); x.fill();
      }
      x.globalAlpha = son ? 0.9 : 0.35 + 0.65 * parlak;
      x.fillStyle = son ? renkS : n.tur === 'girdi' ? renkM : renkY;
      x.beginPath(); x.arc(p.sx, p.sy, Math.max(2, r), 0, Math.PI * 2); x.fill();
      if (son) { x.strokeStyle = renkS; x.lineWidth = 1.5; x.beginPath(); x.arc(p.sx, p.sy, r + 5, 0, Math.PI * 2); x.stroke(); }
      x.globalAlpha = d.uzerinde === n.id ? 1 : 0.75 * p.f;
      x.fillStyle = son ? renkS : n.tur === 'cikti' ? renkY : renkSol;
      const etiket = n.tur === 'girdi' ? N.tok(S.istem.tokenlar[n.konum]) : n.etiket;
      x.fillText(etiket, p.sx, p.sy - r - 9);
    }
    x.globalAlpha = 1;
    yaz(a);
    if (t < uyanik || (!N.azalt() && !document.hidden)) requestAnimationFrame(kare); else dongu = false;
  }
  let dongu = false;
  function uyandir() { uyanik = Math.max(uyanik, performance.now() + 1200); if (!dongu) { dongu = true; requestAnimationFrame(kare); } }

  let surukle = null;
  function enYakin(e) {
    let en = null, ed = 18;
    for (const c of cizimler) { const dd = Math.hypot(c.p.sx - e.clientX, c.p.sy - e.clientY); if (dd < ed) { ed = dd; en = c.n; } }
    return en;
  }
  cv.addEventListener('pointerdown', (e) => { surukle = { x: e.clientX, y: e.clientY, yaw: d.yaw, pitch: d.pitch, hareket: 0 }; cv.setPointerCapture(e.pointerId); cv.classList.add('surukle'); });
  cv.addEventListener('pointermove', (e) => {
    if (surukle) {
      surukle.hareket = Math.max(surukle.hareket, Math.hypot(e.clientX - surukle.x, e.clientY - surukle.y));
      d.yaw = surukle.yaw + (e.clientX - surukle.x) * 0.008; d.pitch = Math.max(-1.2, Math.min(1.2, surukle.pitch + (e.clientY - surukle.y) * 0.006));
      uyandir(); return;
    }
    const n = enYakin(e), id = n ? n.id : null;
    cv.style.cursor = n && n.tur !== 'cikti' ? 'pointer' : '';
    if (id !== d.uzerinde) { d.uzerinde = id; uyandir(); }
  });
  const birak = (e) => {
    if (!surukle) return;
    const tik = surukle.hareket < 5; surukle = null; cv.classList.remove('surukle'); uyanik = performance.now() + 2500;
    if (tik && e.type === 'pointerup') { const n = enYakin(e); if (n && n.tur !== 'cikti') { d.sonuk.has(n.id) ? d.sonuk.delete(n.id) : d.sonuk.add(n.id); uyandir(); } }
  };
  cv.addEventListener('pointerup', birak); cv.addEventListener('pointercancel', birak);
  cv.addEventListener('wheel', (e) => { if (!e.deltaY) return; e.preventDefault(); d.zoom = Math.max(0.5, Math.min(2.2, d.zoom * Math.exp(-e.deltaY * 0.0012))); uyandir(); }, { passive: false });
  cv.addEventListener('keydown', (e) => {
    const m = { ArrowLeft: [-0.12, 0], ArrowRight: [0.12, 0], ArrowUp: [0, -0.1], ArrowDown: [0, 0.1] }[e.key];
    if (m) { e.preventDefault(); d.yaw += m[0]; d.pitch = Math.max(-1.2, Math.min(1.2, d.pitch + m[1])); uyandir(); }
  });
  addEventListener('resize', uyandir);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) uyandir(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', uyandir);
  new MutationObserver(uyandir).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  dock = N.sistem($('sistem'), { S: () => S, secili: () => d.secili, degis: (k) => { d.secili.has(k) ? d.secili.delete(k) : d.secili.add(k); dock.yenile(); }, sekme: '3b' });
  dock.karisim(0.6);
  const cekAc = () => { const kapali = cek.classList.toggle('kapali'); $('cekmece-bas').setAttribute('aria-expanded', String(!kapali)); $('cekmece-ipucu').textContent = kapali ? 'açmak için tıkla' : 'kapatmak için tıkla'; };
  $('cekmece-bas').addEventListener('click', cekAc); $('cekmece-bas').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cekAc(); } });
  new ResizeObserver(() => { document.documentElement.style.setProperty('--cek-h', cek.offsetHeight + 'px'); uyandir(); }).observe(cek);
  yukle();
  // Örnek: en parlak ikinci banttaki özellik söndürülmüş.
  const ornek = S.graf.dugumler.find((n) => n.bant === 1);
  if (ornek) d.sonuk.add(ornek.id);
  uyandir();
})();
</script>
</body>
</html>
